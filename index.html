<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AirMic Voice-to-Text & Auto-Title</title>

  <!-- PeerJS for WebRTC Direct Streaming -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QRCode.js for Instant Phone Pairing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 6px;
      margin-bottom: 16px;
    }
    .badge-disconnected { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-connected { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-waiting { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Laptop QR Wrapper */
    #qr-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 12px 0;
      padding: 14px;
      background: #0f172a;
      border-radius: 14px;
      border: 1px dashed var(--border);
    }

    #qrcode {
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .url-input {
      margin-top: 10px;
      width: 100%;
      padding: 8px 12px;
      font-size: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      text-align: center;
    }

    /* Waveform Canvas */
    canvas#visualizer {
      width: 100%;
      height: 55px;
      background: #0b1120;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--border);
    }

    /* Title & Transcription Card */
    .stt-card {
      margin-top: 16px;
      padding: 16px;
      background: #0b1120;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
    }
    .title-input:focus { border-color: var(--accent); }

    .stt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .stt-status {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
    }

    .transcript-box {
      width: 100%;
      height: 95px;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
    .action-btn:hover { background: #334155; }

    /* Phone Controls */
    .mic-button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 32px 0 20px 0;
    }

    .record-btn {
      background: var(--danger);
      color: white;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn:active { transform: scale(0.95); }
    .record-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    .recording-pulse {
      animation: pulse-ring 1.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 22px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .timer-display {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--danger);
      font-variant-numeric: tabular-nums;
      margin-top: 8px;
    }

    /* Logs */
    .log-box {
      margin-top: 14px;
      padding: 8px 10px;
      background: #060911;
      border-radius: 8px;
      border: 1px solid var(--border);
      height: 75px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.72rem;
      text-align: left;
      color: #64748b;
    }
    .log-entry { margin-bottom: 2px; }
  </style>

  <!-- ES Module Script for Whisper AI fallback -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    window.initWhisper = async function(onProgress) {
      return await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {
        progress_callback: onProgress
      });
    };
  </script>
</head>
<body>

  <div class="card">
    <h1 id="view-title">AirMic Audio-to-Text</h1>
    <div id="connection-status" class="badge badge-waiting">Initializing peer connection...</div>

    <!-- ==================== LAPTOP RECEIVER VIEW ==================== -->
    <div id="laptop-view" style="display: none;">
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Scan this QR code with your phone camera to pair:
      </p>

      <div id="qr-wrapper">
        <div id="qrcode"></div>
        <input type="text" id="share-url" class="url-input" readonly />
      </div>

      <div style="margin-top: 14px;">
        <h3 style="font-size: 0.85rem; margin-bottom: 6px; text-align: left;">Latest Audio Input</h3>
        <audio id="audio-playback" controls style="width: 100%; border-radius: 8px;"></audio>
        <canvas id="visualizer"></canvas>
      </div>

      <!-- Generated Title & Transcription Card -->
      <div class="stt-card">
        <div class="title-row">
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Title:</label>
          <input type="text" id="generated-title" class="title-input" placeholder="Audio Title will be generated here..." />
        </div>

        <div class="stt-header">
          <strong style="font-size: 0.8rem;">📝 Transcribed Speech</strong>
          <span id="stt-status" class="stt-status">Ready</span>
        </div>

        <textarea id="transcript-text" class="transcript-box" placeholder="Your transcribed text will appear here automatically after you record on your phone..."></textarea>

        <div class="btn-row">
          <button id="btn-copy" class="action-btn">📋 Copy Note</button>
          <button id="btn-save-txt" class="action-btn">💾 Save .TXT</button>
          <button id="btn-save-audio" class="action-btn">🎵 Save Audio</button>
        </div>
      </div>
    </div>

    <!-- ==================== PHONE TRANSMITTER VIEW ==================== -->
    <div id="phone-view" style="display: none;">
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Tap Record, speak into your phone, and tap Stop. Your voice will automatically transfer, transcribe, and get a title on your laptop.
      </p>

      <div class="mic-button-container">
        <button id="record-trigger" class="record-btn" disabled>
          <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span id="record-btn-text">Record</span>
        </button>
      </div>

      <div id="record-timer" class="timer-display" style="display: none;">00:00</div>
    </div>

    <!-- System Event Logs -->
    <div id="event-logs" class="log-box"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetPeerId = params.get('pair');
    const isMobileMode = Boolean(targetPeerId);

    const logContainer = document.getElementById('event-logs');
    const statusBadge = document.getElementById('connection-status');
    const viewTitle = document.getElementById('view-title');

    function appendLog(msg) {
      const el = document.createElement('div');
      el.className = 'log-entry';
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logContainer.appendChild(el);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Smart Auto-Title Generator
    function generateSmartTitle(text) {
      if (!text || text.trim().length === 0) {
        return `Voice Memo - ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      }

      const clean = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
      const words = clean.split(/\s+/);
      const lower = text.toLowerCase();

      // Check intent patterns
      if (lower.includes("remind me to") || lower.includes("reminder")) {
        return `Reminder: ${words.slice(0, 5).join(" ")}...`;
      }
      if (lower.includes("meeting") || lower.includes("discuss") || lower.includes("project")) {
        return `Project Note: ${words.slice(0, 4).join(" ")}`;
      }
      if (lower.includes("idea") || lower.includes("design") || lower.includes("concept")) {
        return `Design Idea: ${words.slice(0, 4).join(" ")}`;
      }

      // Default: Capitalize first 4-5 words
      const summaryWords = words.slice(0, 5).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
      return summaryWords.join(" ");
    }

    const peer = new Peer();

    /* ========================================================
       LAPTOP MODE (RECEIVE, TRANSCRIBE, AUTO-TITLE)
       ======================================================== */
    if (!isMobileMode) {
      document.getElementById('laptop-view').style.display = 'block';
      viewTitle.textContent = "💻 Laptop Receiver";

      let transcriberPipeline = null;
      let isModelLoading = false;
      let lastAudioBlob = null;

      const sttStatus = document.getElementById('stt-status');
      const transcriptBox = document.getElementById('transcript-text');
      const titleInput = document.getElementById('generated-title');

      // Pre-warm Whisper AI
      async function loadWhisperModel() {
        if (transcriberPipeline || isModelLoading) return;
        isModelLoading = true;
        sttStatus.textContent = "Loading AI Engine...";
        appendLog("Pre-loading Whisper model into browser cache...");

        try {
          transcriberPipeline = await window.initWhisper((prog) => {
            if (prog.status === 'progress') {
              sttStatus.textContent = `Loading AI: ${Math.round(prog.progress || 0)}%`;
            }
          });
          sttStatus.textContent = "AI Ready ✅";
          appendLog("Whisper model ready for local transcription.");
        } catch (err) {
          sttStatus.textContent = "AI Ready (Web Speech)";
          appendLog(`Whisper note: ${err.message}`);
        } finally {
          isModelLoading = false;
        }
      }

      peer.on('open', (id) => {
        statusBadge.textContent = "Waiting for Phone to Connect...";
        statusBadge.className = "badge badge-waiting";
        appendLog(`Laptop Peer ID: ${id}`);

        const pairUrl = `${window.location.origin}${window.location.pathname}?pair=${id}`;
        document.getElementById('share-url').value = pairUrl;

        new QRCode(document.getElementById("qrcode"), {
          text: pairUrl,
          width: 170,
          height: 170,
          colorDark: "#090d16",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        loadWhisperModel();
      });

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          statusBadge.textContent = "Phone Paired & Ready ✅";
          statusBadge.className = "badge badge-connected";
          appendLog("Phone connected via WebRTC.");
        });

        conn.on('data', async (payload) => {
          if (payload && payload.type === 'AUDIO_CLIP') {
            appendLog(`Received audio payload: ${(payload.buffer.byteLength / 1024).toFixed(1)} KB`);

            const blob = new Blob([payload.buffer], { type: payload.mimeType });
            lastAudioBlob = blob;
            const audioSrc = URL.createObjectURL(blob);

            const player = document.getElementById('audio-playback');
            player.src = audioSrc;
            player.play().catch(() => appendLog("Autoplay blocked. Click play."));

            // Check if phone already transcribed via Web Speech API
            if (payload.phoneTranscript && payload.phoneTranscript.length > 0) {
              const text = payload.phoneTranscript.trim();
              transcriptBox.value = text;
              titleInput.value = generateSmartTitle(text);
              sttStatus.textContent = "Transcribed (Phone) ✅";
              appendLog(`Transcribed: "${text}"`);
              appendLog(`Auto-Title: "${titleInput.value}"`);
            }

            // Decode and run waveform + Whisper inference
            handleIncomingAudio(blob, payload.phoneTranscript);
          }
        });

        conn.on('close', () => {
          statusBadge.textContent = "Phone Disconnected ❌";
          statusBadge.className = "badge badge-disconnected";
          appendLog("Phone disconnected.");
        });
      });

      async function handleIncomingAudio(blob, existingText) {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const arrayBuffer = await blob.arrayBuffer();
          const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          drawWaveform(decodedBuffer.getChannelData(0));

          // If phone already captured text via Web Speech API, skip heavy Whisper run
          if (existingText && existingText.trim().length > 0) {
            return;
          }

          if (!transcriberPipeline) {
            await loadWhisperModel();
          }

          if (transcriberPipeline) {
            sttStatus.textContent = "Transcribing with Whisper AI...";
            appendLog("Transcribing audio on laptop with Whisper...");

            const targetSampleRate = 16000;
            const offlineCtx = new OfflineAudioContext(
              1,
              Math.ceil(decodedBuffer.duration * targetSampleRate),
              targetSampleRate
            );
            const source = offlineCtx.createBufferSource();
            source.buffer = decodedBuffer;
            source.connect(offlineCtx.destination);
            source.start(0);
            const resampledBuffer = await offlineCtx.startRendering();
            const audioData16k = resampledBuffer.getChannelData(0);

            const result = await transcriberPipeline(audioData16k);
            const text = result.text.trim();

            transcriptBox.value = text;
            titleInput.value = generateSmartTitle(text);
            sttStatus.textContent = "Complete ✅";
            appendLog(`Transcribed: "${text}"`);
            appendLog(`Auto-Title: "${titleInput.value}"`);
          }
        } catch (err) {
          sttStatus.textContent = "Processing Notice";
          appendLog(`Notice: ${err.message}`);
        }
      }

      function drawWaveform(data) {
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';

        const step = Math.ceil(data.length / canvas.width);
        const amp = canvas.height / 2;

        for (let i = 0; i < canvas.width; i++) {
          let min = 1.0;
          let max = -1.0;
          for (let j = 0; j < step; j++) {
            const datum = data[(i * step) + j];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
          }
          ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
        }
      }

      // Export Buttons
      document.getElementById('btn-copy').onclick = () => {
        const fullContent = `${titleInput.value}\n\n${transcriptBox.value}`;
        navigator.clipboard.writeText(fullContent);
        appendLog("Copied title and transcript to clipboard.");
      };

      document.getElementById('btn-save-txt').onclick = () => {
        const title = titleInput.value || "Untitled Note";
        const content = `${title}\nDate: ${new Date().toLocaleString()}\n\n${transcriptBox.value}`;
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${title.toLowerCase().replace(/[^a-z0-9]/g, "_")}.txt`;
        a.click();
      };

      document.getElementById('btn-save-audio').onclick = () => {
        if (!lastAudioBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastAudioBlob);
        a.download = `recording-${Date.now()}.webm`;
        a.click();
      };

    /* ========================================================
       PHONE MODE (RECORD & REAL-TIME SPEECH CAPTURE)
       ======================================================== */
    } else {
      document.getElementById('phone-view').style.display = 'block';
      viewTitle.textContent = "📱 Phone Microphone";

      const recordBtn = document.getElementById('record-trigger');
      const btnText = document.getElementById('record-btn-text');
      const timerDisplay = document.getElementById('record-timer');

      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let timerInterval;
      let startTime;
      let liveTranscript = "";

      // Native Web Speech Recognition on Phone
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
          let str = "";
          for (let i = 0; i < event.results.length; ++i) {
            str += event.results[i][0].transcript + " ";
          }
          liveTranscript = str;
        };
      }

      peer.on('open', () => {
        appendLog("Connecting to laptop peer...");
        const conn = peer.connect(targetPeerId, { reliable: true });

        conn.on('open', () => {
          statusBadge.textContent = "Connected to Laptop ✅";
          statusBadge.className = "badge badge-connected";
          recordBtn.disabled = false;
          appendLog("Linked. Ready to record.");
        });

        conn.on('close', () => {
          statusBadge.textContent = "Disconnected from Laptop ❌";
          statusBadge.className = "badge badge-disconnected";
          recordBtn.disabled = true;
          appendLog("Connection lost.");
        });

        async function initAudio() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }
            });

            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
              ? 'audio/webm;codecs=opus'
              : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');

            mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);

            mediaRecorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
              const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
              recordedChunks = [];

              appendLog(`Sending ${(audioBlob.size / 1024).toFixed(1)} KB to laptop...`);

              const arrayBuffer = await audioBlob.arrayBuffer();
              conn.send({
                type: 'AUDIO_CLIP',
                buffer: arrayBuffer,
                mimeType: mediaRecorder.mimeType || 'audio/webm',
                phoneTranscript: liveTranscript
              });

              appendLog("Sent to laptop!");
              liveTranscript = "";
            };

            recordBtn.onclick = () => {
              if (!isRecording) {
                recordedChunks = [];
                liveTranscript = "";
                mediaRecorder.start();
                if (recognition) {
                  try { recognition.start(); } catch(e) {}
                }
                isRecording = true;
                btnText.textContent = "Stop";
                recordBtn.classList.add('recording-pulse');
                timerDisplay.style.display = 'block';
                startTime = Date.now();

                timerInterval = setInterval(() => {
                  const elapsed = Math.floor((Date.now() - startTime) / 1000);
                  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                  const s = String(elapsed % 60).padStart(2, '0');
                  timerDisplay.textContent = `${m}:${s}`;
                }, 500);
              } else {
                mediaRecorder.stop();
                if (recognition) {
                  try { recognition.stop(); } catch(e) {}
                }
                isRecording = false;
                btnText.textContent = "Record";
                recordBtn.classList.remove('recording-pulse');
                clearInterval(timerInterval);
                timerDisplay.style.display = 'none';
              }
            };

          } catch (err) {
            appendLog(`Microphone Error: ${err.message}. Please grant permission.`);
          }
        }

        initAudio();
      });
    }
  </script>
</body>
</html>
