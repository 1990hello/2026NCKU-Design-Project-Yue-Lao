<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AirMic P2P Audio Relay & Transcriber</title>
  
  <!-- PeerJS for WebRTC Direct Streaming -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QRCode.js for Instant Pairing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314e;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 18px;
    }
    .badge-disconnected { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-connected { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-waiting { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Laptop QR Wrapper */
    #qr-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 14px 0;
      padding: 14px;
      background: #0f172a;
      border-radius: 14px;
      border: 1px dashed var(--border);
    }

    #qrcode {
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .url-input {
      margin-top: 10px;
      width: 100%;
      padding: 8px 12px;
      font-size: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      text-align: center;
    }

    /* Waveform Canvas */
    canvas#visualizer {
      width: 100%;
      height: 60px;
      background: #0b1120;
      border-radius: 8px;
      margin-top: 12px;
      border: 1px solid var(--border);
    }

    /* Transcription Section */
    .stt-card {
      margin-top: 18px;
      padding: 16px;
      background: #0b1120;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .stt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .stt-status {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
    }

    .transcript-box {
      width: 100%;
      height: 100px;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }
    .action-btn:hover { background: #334155; }

    /* Phone Controls */
    .mic-button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 32px 0 20px 0;
    }

    .record-btn {
      background: var(--danger);
      color: white;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn:active { transform: scale(0.95); }
    .record-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    .recording-pulse {
      animation: pulse-ring 1.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 22px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .timer-display {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--danger);
      font-variant-numeric: tabular-nums;
      margin-top: 8px;
    }

    /* Logs */
    .log-box {
      margin-top: 16px;
      padding: 10px;
      background: #060911;
      border-radius: 8px;
      border: 1px solid var(--border);
      height: 80px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.72rem;
      text-align: left;
      color: #64748b;
    }
    .log-entry { margin-bottom: 2px; }
  </style>

  <!-- ES Module Script for Transformers.js Whisper -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    
    // Configure Transformers.js to allow remote downloads and cache in browser
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    // Attach pipeline loader to global window scope
    window.initWhisper = async function(onProgress) {
      return await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {
        progress_callback: onProgress
      });
    };
  </script>
</head>
<body>

  <div class="card">
    <h1 id="view-title">AirMic Transcriber</h1>
    <div id="connection-status" class="badge badge-waiting">Initializing peer connection...</div>

    <!-- ==================== LAPTOP RECEIVER VIEW ==================== -->
    <div id="laptop-view" style="display: none;">
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Scan this QR code with your phone camera to pair:
      </p>

      <div id="qr-wrapper">
        <div id="qrcode"></div>
        <input type="text" id="share-url" class="url-input" readonly />
      </div>

      <div style="margin-top: 16px;">
        <h3 style="font-size: 0.9rem; margin-bottom: 8px; text-align: left;">Latest Audio Input</h3>
        <audio id="audio-playback" controls style="width: 100%; border-radius: 8px;"></audio>
        <canvas id="visualizer"></canvas>
      </div>

      <!-- Live Speech-to-Text Card -->
      <div class="stt-card">
        <div class="stt-header">
          <strong style="font-size: 0.85rem;">📝 AI Transcription</strong>
          <span id="stt-status" class="stt-status">AI Ready</span>
        </div>
        
        <textarea id="transcript-text" class="transcript-box" placeholder="Your transcribed text will appear here automatically when you speak into your phone..." readonly></textarea>
        
        <div class="btn-row">
          <button id="btn-copy" class="action-btn">📋 Copy Text</button>
          <button id="btn-save-txt" class="action-btn">💾 Save .TXT</button>
          <button id="btn-save-audio" class="action-btn">🎵 Save Audio</button>
        </div>
      </div>
    </div>

    <!-- ==================== PHONE TRANSMITTER VIEW ==================== -->
    <div id="phone-view" style="display: none;">
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Tap Record, speak, and tap Stop. The audio will automatically transfer and transcribe on your laptop.
      </p>

      <div class="mic-button-container">
        <button id="record-trigger" class="record-btn" disabled>
          <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span id="record-btn-text">Record</span>
        </button>
      </div>

      <div id="record-timer" class="timer-display" style="display: none;">00:00</div>
    </div>

    <!-- System Event Logs -->
    <div id="event-logs" class="log-box"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetPeerId = params.get('pair');
    const isMobileMode = Boolean(targetPeerId);

    const logContainer = document.getElementById('event-logs');
    const statusBadge = document.getElementById('connection-status');
    const viewTitle = document.getElementById('view-title');

    function appendLog(msg) {
      const el = document.createElement('div');
      el.className = 'log-entry';
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logContainer.appendChild(el);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    const peer = new Peer();

    /* ========================================================
       LAPTOP MODE (RECEIVE, RESAMPLE, TRANSCRIBE)
       ======================================================== */
    if (!isMobileMode) {
      document.getElementById('laptop-view').style.display = 'block';
      viewTitle.textContent = "💻 Laptop Receiver";

      let transcriberPipeline = null;
      let isModelLoading = false;
      let lastAudioBlob = null;

      const sttStatus = document.getElementById('stt-status');
      const transcriptBox = document.getElementById('transcript-text');

      // Initialize Whisper AI Pipeline
      async function loadWhisperModel() {
        if (transcriberPipeline || isModelLoading) return;
        isModelLoading = true;
        sttStatus.textContent = "Loading AI Model...";
        appendLog("Pre-loading Whisper model into browser memory...");

        try {
          transcriberPipeline = await window.initWhisper((prog) => {
            if (prog.status === 'progress') {
              sttStatus.textContent = `Loading AI: ${Math.round(prog.progress || 0)}%`;
            }
          });
          sttStatus.textContent = "AI Ready ✅";
          appendLog("Whisper model loaded and ready for transcription.");
        } catch (err) {
          sttStatus.textContent = "AI Init Error";
          appendLog(`Whisper load error: ${err.message}`);
        } finally {
          isModelLoading = false;
        }
      }

      // Pre-warm the model after peer creation
      peer.on('open', (id) => {
        statusBadge.textContent = "Waiting for Phone to Connect...";
        statusBadge.className = "badge badge-waiting";
        appendLog(`Peer established ID: ${id}`);

        const pairUrl = `${window.location.origin}${window.location.pathname}?pair=${id}`;
        document.getElementById('share-url').value = pairUrl;

        new QRCode(document.getElementById("qrcode"), {
          text: pairUrl,
          width: 170,
          height: 170,
          colorDark: "#090d16",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        // Trigger model warm-up in background
        loadWhisperModel();
      });

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          statusBadge.textContent = "Phone Paired & Ready ✅";
          statusBadge.className = "badge badge-connected";
          appendLog("Phone connected via WebRTC data channel.");
        });

        conn.on('data', async (payload) => {
          if (payload && payload.type === 'AUDIO_CLIP') {
            appendLog(`Received audio payload: ${(payload.buffer.byteLength / 1024).toFixed(1)} KB`);

            const blob = new Blob([payload.buffer], { type: payload.mimeType });
            lastAudioBlob = blob;
            const audioSrc = URL.createObjectURL(blob);

            const player = document.getElementById('audio-playback');
            player.src = audioSrc;
            player.play().catch(() => appendLog("Autoplay blocked. Tap play button."));

            // Process audio and transcribe
            handleIncomingAudio(blob);
          }
        });

        conn.on('close', () => {
          statusBadge.textContent = "Phone Disconnected ❌";
          statusBadge.className = "badge badge-disconnected";
          appendLog("Phone disconnected.");
        });
      });

      // Decode audio, draw waveform, resample to 16 kHz, and feed to Whisper
      async function handleIncomingAudio(blob) {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const arrayBuffer = await blob.arrayBuffer();
          const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          // Draw visual waveform
          drawWaveform(decodedBuffer.getChannelData(0));

          // Ensure Whisper model is ready
          if (!transcriberPipeline) {
            await loadWhisperModel();
          }

          sttStatus.textContent = "Transcribing...";
          appendLog("Transcribing voice audio with Whisper...");

          // Resample audio to 16 kHz Mono Float32Array (Whisper requirement)
          const targetSampleRate = 16000;
          const offlineCtx = new OfflineAudioContext(
            1,
            Math.ceil(decodedBuffer.duration * targetSampleRate),
            targetSampleRate
          );
          const source = offlineCtx.createBufferSource();
          source.buffer = decodedBuffer;
          source.connect(offlineCtx.destination);
          source.start(0);
          const resampledBuffer = await offlineCtx.startRendering();
          const audioData16k = resampledBuffer.getChannelData(0);

          // Run transcription inference
          const result = await transcriberPipeline(audioData16k);
          const text = result.text.trim();

          transcriptBox.value = text;
          sttStatus.textContent = "Transcription Complete ✅";
          appendLog(`Transcribed: "${text}"`);

        } catch (err) {
          sttStatus.textContent = "Transcription Failed";
          appendLog(`Processing error: ${err.message}`);
        }
      }

      // Draw Waveform Canvas
      function drawWaveform(data) {
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';

        const step = Math.ceil(data.length / canvas.width);
        const amp = canvas.height / 2;

        for (let i = 0; i < canvas.width; i++) {
          let min = 1.0;
          let max = -1.0;
          for (let j = 0; j < step; j++) {
            const datum = data[(i * step) + j];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
          }
          ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
        }
      }

      // Export Buttons
      document.getElementById('btn-copy').onclick = () => {
        navigator.clipboard.writeText(transcriptBox.value);
        appendLog("Transcript copied to clipboard.");
      };

      document.getElementById('btn-save-txt').onclick = () => {
        const text = transcriptBox.value;
        if (!text) return;
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `transcript-${Date.now()}.txt`;
        a.click();
      };

      document.getElementById('btn-save-audio').onclick = () => {
        if (!lastAudioBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastAudioBlob);
        a.download = `recording-${Date.now()}.webm`;
        a.click();
      };

    /* ========================================================
       PHONE MODE (RECORD & STREAM)
       ======================================================== */
    } else {
      document.getElementById('phone-view').style.display = 'block';
      viewTitle.textContent = "📱 Phone Microphone";

      const recordBtn = document.getElementById('record-trigger');
      const btnText = document.getElementById('record-btn-text');
      const timerDisplay = document.getElementById('record-timer');

      let mediaRecorder;
      let recordedChunks = [];
      let isRecording = false;
      let timerInterval;
      let startTime;

      peer.on('open', () => {
        appendLog("Connecting to laptop peer...");
        const conn = peer.connect(targetPeerId, { reliable: true });

        conn.on('open', () => {
          statusBadge.textContent = "Connected to Laptop ✅";
          statusBadge.className = "badge badge-connected";
          recordBtn.disabled = false;
          appendLog("Linked. Ready to record.");
        });

        conn.on('close', () => {
          statusBadge.textContent = "Disconnected from Laptop ❌";
          statusBadge.className = "badge badge-disconnected";
          recordBtn.disabled = true;
          appendLog("Connection lost.");
        });

        async function initAudio() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
              }
            });

            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
              ? 'audio/webm;codecs=opus'
              : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');

            mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);

            mediaRecorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
              const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
              recordedChunks = [];

              appendLog(`Sending ${(audioBlob.size / 1024).toFixed(1)} KB to laptop...`);

              const arrayBuffer = await audioBlob.arrayBuffer();
              conn.send({
                type: 'AUDIO_CLIP',
                buffer: arrayBuffer,
                mimeType: mediaRecorder.mimeType || 'audio/webm'
              });

              appendLog("Sent to laptop!");
            };

            recordBtn.onclick = () => {
              if (!isRecording) {
                recordedChunks = [];
                mediaRecorder.start();
                isRecording = true;
                btnText.textContent = "Stop";
                recordBtn.classList.add('recording-pulse');
                timerDisplay.style.display = 'block';
                startTime = Date.now();

                timerInterval = setInterval(() => {
                  const elapsed = Math.floor((Date.now() - startTime) / 1000);
                  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                  const s = String(elapsed % 60).padStart(2, '0');
                  timerDisplay.textContent = `${m}:${s}`;
                }, 500);
              } else {
                mediaRecorder.stop();
                isRecording = false;
                btnText.textContent = "Record";
                recordBtn.classList.remove('recording-pulse');
                clearInterval(timerInterval);
                timerDisplay.style.display = 'none';
              }
            };

          } catch (err) {
            appendLog(`Microphone Error: ${err.message}. Please grant permission.`);
          }
        }

        initAudio();
      });
    }
  </script>
</body>
</html>
